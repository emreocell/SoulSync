name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release button: Actions › CI › Run workflow, with a version such as
  # 0.1.0. It builds main and publishes it as that version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.1.0"
        required: true
      mac:
        description: "Also build the Mac app"
        type: boolean
        default: false

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  # The desktop app for Windows, to download from the run's summary page.
  # Builds of main are also published, as pre-releases, and a version made
  # with the Release button as a full release; the app looks for updates
  # there, see crates/soulsync-app/src/update.rs.
  windows-app:
    runs-on: windows-latest
    # One build of main at a time, so releases come out in order.
    concurrency:
      group: windows-app-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SOULSYNC_BUILD: ${{ github.run_number }}
      SOULSYNC_VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "$SOULSYNC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "A version looks like 0.1.0"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "Releases are made from main"; exit 1; }
      - uses: actions/checkout@v4
        with:
          # Releases need the tags to find what changed since the last version.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p soulsync-app
      # The release below is what the app installs; do not let a failing
      # artifact upload hold it back.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SoulSync-windows
          path: target/release/SoulSync.exe
          if-no-files-found: error
      # Offered only to players who chose preview builds in the app.
      # Checksum for the release notes, so anyone can check the download.
      # With a VIRUSTOTAL secret (a free VirusTotal API key), releases also send
      # the exe to VirusTotal and link the scan; without it this is skipped.
      - name: Checksum and virus scan
        id: sum
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL || secrets.VT_API_KEY }}
        run: |
          sha=$(sha256sum target/release/SoulSync.exe | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          vt=""
          if [ -n "$VT_API_KEY" ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if curl -sSf --max-time 300 -H "x-apikey: $VT_API_KEY" -F "file=@target/release/SoulSync.exe" https://www.virustotal.com/api/v3/files > /dev/null; then
              vt="https://www.virustotal.com/gui/file/$sha"
            else
              echo "::warning::Upload to VirusTotal failed; the release goes out without the link."
            fi
          fi
          echo "vt=$vt" >> "$GITHUB_OUTPUT"
      - name: Publish the build as a pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" target/release/SoulSync.exe
          --target "${{ github.sha }}" --title "Build ${{ github.run_number }}"
          --notes "Preview build of SoulSync for Windows, built from ${{ github.sha }}. Apps set to preview builds install this by itself. SHA-256 of SoulSync.exe: ${{ steps.sum.outputs.sha }}"
          --prerelease
      # The app reads the version from the title, so keep "SoulSync <version>".
      - name: Publish the version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          {
            echo "## What's new"
            echo
            python .github/scripts/release_notes.py notes "$SOULSYNC_VERSION"
            echo
            echo "## Download"
            echo
            echo "SoulSync $SOULSYNC_VERSION for Windows. Download **SoulSync.exe** and start it; later versions install from inside the app. New here? See [Getting started](https://github.com/${{ github.repository }}#getting-started)."
            echo
            echo "> [!NOTE]"
            echo "> The app is not code-signed yet, so Windows SmartScreen warns on the first start (*Windows protected your PC*). Choose **More info › Run anyway**. This exe was built from commit ${{ github.sha }} by [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}), from the open source code in this repository."
            echo
            echo "**SHA-256** of SoulSync.exe: \`${{ steps.sum.outputs.sha }}\`"
            if [ -n "${{ steps.sum.outputs.vt }}" ]; then
              echo
              echo "**VirusTotal:** ${{ steps.sum.outputs.vt }}"
            fi
          } > notes.md
          gh release create "build-${{ github.run_number }}" target/release/SoulSync.exe \
            --target "${{ github.sha }}" --title "SoulSync $SOULSYNC_VERSION" \
            --notes-file notes.md \
            --latest
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/v$SOULSYNC_VERSION" -f sha="${{ github.sha }}"
      # Patch notes for the Discord server, as a post in #announcements. Needs a
      # DISCORD_WEBHOOK secret (Discord: channel settings › Integrations ›
      # Webhooks › Copy URL); DISCORD_ROLE, a role id to ping, is optional.
      # Without the secret this does nothing, and it never fails the release.
      - name: Announce on Discord
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD }}
          DISCORD_ROLE: ${{ vars.DISCORD_ROLE || secrets.DISCORD_ROLE }}
          PYTHONUTF8: "1"
        run: python .github/scripts/release_notes.py discord "$SOULSYNC_VERSION" "https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"

  # The desktop app for macOS, one app for Apple Silicon and Intel Macs. It
  # is attached to the release the Windows job made; the app on a Mac does
  # not update itself yet. It is signed ad hoc only, so macOS asks once
  # before opening it, see docs/mac.md.
  # The Mac version is on hold, and macOS runners can queue for a long time
  # and then get cancelled, which turned whole runs red. So it is built only
  # when asked for: Run workflow with "Also build the Mac app" ticked.
  mac-app:
    if: github.event_name == 'workflow_dispatch' && inputs.mac
    runs-on: macos-latest
    needs: windows-app
    permissions:
      contents: write
    env:
      SOULSYNC_BUILD: ${{ github.run_number }}
      SOULSYNC_VERSION: ${{ inputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p soulsync-app --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Make SoulSync.app
        shell: bash
        run: |
          app=dist/SoulSync.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/SoulSync" \
            target/aarch64-apple-darwin/release/SoulSync target/x86_64-apple-darwin/release/SoulSync
          sed -e "s/@VERSION@/${SOULSYNC_VERSION:-0.0.$SOULSYNC_BUILD}/" -e "s/@BUILD@/$SOULSYNC_BUILD/" \
            assets/macos/Info.plist > "$app/Contents/Info.plist"
          icons=dist/SoulSync.iconset
          mkdir -p "$icons"
          for size in 16 32 128 256; do
            sips -z $size $size assets/soulsync-icon-256.png --out "$icons/icon_${size}x${size}.png" >/dev/null
          done
          for size in 16 32 128; do
            double=$((size * 2))
            sips -z $double $double assets/soulsync-icon-256.png --out "$icons/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$icons" -o "$app/Contents/Resources/SoulSync.icns"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo -info "$app/Contents/MacOS/SoulSync"
          ditto -c -k --keepParent "$app" dist/SoulSync-mac.zip
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SoulSync-mac
          path: dist/SoulSync-mac.zip
          if-no-files-found: error
      - name: Attach it to the release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "build-${{ github.run_number }}" dist/SoulSync-mac.zip --clobber --repo "${{ github.repository }}"
